{% load static %}

<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title%}{% endblock %}</title>
        <script>
            (function () {
                var stored = localStorage.getItem("theme");
                var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (stored === "dark" || (!stored && prefersDark)) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>
        <link rel="stylesheet" href="{% static 'css/output.css' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon.png' %}">
        <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}">
        <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
        <link rel="icon" type="image/png" sizes="16x16" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAACyUlEQVR4nHVTT0hbeRic7+U1fbVGYrTgY6vJEyqKJSpUNEZ59Q8+REEL8aYXD1GJKxtRT5VfD54KlVLa6tXL4jUgtB40SO1BuuxJ1tXFwLYouAsthhatq5k9bCztmn6X7zLzzQzDJwBAUgDcXl5eLiosLPwYDof/SKVSfq/Xm/H5fH+LyCFJERHi/7Ozs9MQiUTe+P3+z6ZpMhQKpRcXF1+XlZWdlJSUsLOz8xPJm18JfTsdHR1HANjc3JwBwEAgwJaWFuq6zsbGxv2JiYkFkjdEJPcBx3EO6+rqODQ0dKZpWkZEzktLS49mZ2cfkSy6wCmltEvkrK3i3d3dEcuyzgCcA6DjOPsktQvbJN05yQCQSqX8Y2NjzwH809bW9jEYDB4bhsGFhYWfAGB8fPxpb2/vXjKZvJPTSTwef2WaJvPz81ldXU2lFAGwqanpHclQT0/PbwColLoPANFo9IpSSlNKaSRFlpaWara3t9sNw+De3t71WCy2FY/HH29sbPgty8LBwcFZOBw+XllZuSsiv9q2ra+vr599N1I2d3VfX98HAATAUCh0Eo1G10i6s20E0ul0lcfj+S+Tbdu6Ukq3bdtIJpP69PT0jGEYp7Zt/1lfX58GwKqqqhOSV2dmZh5UVlaemqbJgYGBzW+UbdvWAWBkZORnwzA4Pz//e0VFxRGAjGVZ6bW1tSder5eBQOC4trb2fXd391+57F8j6U8kErORSOQ0Ly+P5eXlLCgoYE1NDYuLi7m5udlPsohk4QVJstt0HOdtV1fXi6mpqUcAGIvFXg0ODv4CIAOAw8PDCbfbfUlVAAjJH1pbWz94PB76fD62t7cfkiwbHR19CIDBYPCEZEUW6yIpOgCICLPftk/y9tzc3L1MJqNNTk4mROTt6urqy62trR8bGhqeuVyu3f7+fpeInOdq8NKzKKU0TdNA8hZJI6v+BfcvPKVW7TYMaXMAAAAASUVORK5CYII=">
        <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    </head>
    <body class="flex min-h-screen flex-col dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans antialiased sm:px-6 lg:px-8 transition-colors duration-200">
        <div class="sticky top-0 z-50 pt-3">
            <div class="m-5 flex items-center justify-between rounded-2xl border border-slate-200 bg-gradient-to-br from-white/70 to-slate-50/70 p-3 backdrop-blur-md dark:border-slate-700 dark:from-slate-900/90 dark:to-slate-800/90">
                <a href="{% url 'home' %}" class="group flex items-center gap-3">
                    <img src="{% static 'images/logo.png' %}" alt="Wydarzenia Kółek" class=" h-10 w-10 shrink-0 object-contain">
                    <span class="text-lg font-semibold text-slate-800 dark:text-slate-200 transition dark:group-hover:text-slate-50 group-hover:text-slate-600 duration-300">Wydarzenia Kółek</span>
                </a>

                <nav class="flex items-center gap-2 sm:gap-4">
                    <a href="{% url 'home' %}#wydarzenia" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-800 transition-colors hover:text-slate-600 dark:text-slate-200 dark:hover:text-slate-50">Wydarzenia</a>
                    <a href="{% url 'about' %}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-800 transition-colors hover:text-slate-600 dark:text-slate-200 dark:hover:text-slate-50">O nas</a>
                    <a href="{% url 'faq' %}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-800 transition-colors hover:text-slate-600 dark:text-slate-200 dark:hover:text-slate-50">Pytania i Odpowiedzi</a>

                    <button
                        type="button"
                        id="themeToggle"
                        aria-label="Przełącz motyw jasny i ciemny"
                        title="Przełącz motyw"
                        class="ml-1 cursor-pointer rounded-lg p-2 text-slate-800 transition-colors hover:text-slate-600 dark:text-slate-200 dark:hover:text-slate-50"
                    >
                        <!-- Księżyc: widoczny w jasnym motywie -->
                        <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                        </svg>
                        <!-- Słońce: widoczne w ciemnym motywie -->
                        <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                        </svg>
                        <span class="sr-only">Przełącz motyw</span>
                    </button>
                </nav>
            </div>
        </div>

        <div class="flex-1">

        {% block content %} {% endblock %}

        </div>

        <div class="border-t justify-between flex border-slate-950/30 p-2.5 mt-5 text-sm">
            <div class="ml-5 cursor-default text-slate-500">&copy; 2026 Wydarzenia Kółek | Stworzone w Polsce</div>
            <div class="gap-10 flex mr-10">
                <a href="{% url "privacy" %}" class="transition text-slate-500 hover:text-slate-400 duration-300">Polityka Prywatności</a>
                <a href="{% url "tos" %}" class="transition text-slate-500 hover:text-slate-400 duration-300">Regulamin</a>
            </div>
        </div>

        <script>
            document.getElementById("themeToggle").addEventListener("click", function () {
                var isDark = document.documentElement.classList.toggle("dark");
                localStorage.setItem("theme", isDark ? "dark" : "light");
            });
        </script>
    </body>
</html>
